name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-python:
    name: Python ${{ matrix.python-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pytest

      - name: Run test suite
        run: |
          python -m pytest tests -v

      - name: Verify build artifact (wheel & sdist)
        run: |
          python -m pip install build
          python -m build

      - name: Install wheel and exercise Python console scripts
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/quay-wheel-env"
          "$RUNNER_TEMP/quay-wheel-env/bin/python" -m pip install dist/*.whl
          (
            cd "$RUNNER_TEMP"
            env -u PYTHONPATH "$RUNNER_TEMP/quay-wheel-env/bin/quay" --version
            env -u PYTHONPATH "$RUNNER_TEMP/quay-wheel-env/bin/quayd" --version
          )

  test-npm:
    name: NPM Package Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pack NPM package
        run: |
          npm pack --dry-run

      - name: Test installed npm package
        shell: bash
        run: |
          install_dir=$(mktemp -d)
          trap 'rm -rf "$install_dir"' EXIT
          package_tarball=$(npm pack --pack-destination "$install_dir" --silent)
          npm install --global --prefix "$install_dir/npm" "$install_dir/$package_tarball"
          "$install_dir/npm/bin/quay" --version
          "$install_dir/npm/bin/quayd" --version
          "$install_dir/npm/bin/quay" --help
          if QUAY_PYTHON=/no/such/python "$install_dir/npm/bin/quay" --help; then
            echo "Expected failure with missing Python interpreter"
            exit 1
          fi
          mkdir "$install_dir/workspace"
          "$install_dir/npm/bin/quay" --workspace "$install_dir/workspace" init --json |
            WORKSPACE="$install_dir/workspace" node -e '
              const assert = require("node:assert/strict");
              const path = require("node:path");
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                const result = JSON.parse(input);
                assert.equal(result.workspace, process.env.WORKSPACE);
                assert.equal(result.state_dir, path.join(process.env.WORKSPACE, ".quay"));
                assert.equal(result.git_ignore_applied, false);
              });
            '
